version: 2
updates:
  # npm 패키지 매니저(package.json) 관리 설정
  - package-ecosystem: "npm"
    directory: "/"          # package.json 파일이 있는 위치 (루트 디렉토리)
    schedule:
      interval: "weekly"    # 너무 자주 오지 않도록 매주 한 번 검사 (daily, monthly 가능)
    open-pull-requests-limit: 5 # 동시에 열려있을 수 있는 최대 PR 개수 (부담 줄이기용)
